services:
  - type: web
    name: sms-document-service
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: INTERNAL_SERVICE_TOKEN
        sync: false
      - key: INTERNAL_SERVICE_NAME
        value: document-service
      - key: INTERNAL_ALLOWED_SERVICES
        value: sms-service,academic-service,student-service,teacher-service,assessment-service,attendance-service,timetable-attendance-service,auth-service,parent-service,staff-service,fees-service,document-service
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
